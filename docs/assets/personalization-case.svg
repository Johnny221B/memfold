<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif"><title id="title">Personalization case from paper Figure 6</title><desc id="desc">Original response text, reflowed for the MemFold website. Three methods answer the same fitness question.</desc><text x="8" y="18" font-size="14" fill="#666b70" font-weight="bold">User preference:</text><text x="8" y="46" font-size="18" fill="#242728" font-weight="normal">“I dislike using wearable technology and fitness trackers.”</text><text x="8" y="91" font-size="14" fill="#666b70" font-weight="bold">Query:</text><text x="8" y="119" font-size="18" fill="#242728" font-weight="normal">“Can you recommend some effective ways for me to monitor my fitness progress?”</text><text x="8" y="184" font-size="22" fill="#242728" font-weight="bold">(a) GRPO</text><text x="8" y="222" font-size="18" fill="#242728" font-weight="normal">… Keep a record of your weight, body</text><text x="8" y="251" font-size="18" fill="#242728" font-weight="normal">measurements, heart rate, and workout</text><text x="8" y="280" font-size="18" fill="#242728" font-weight="normal">performance.</text><text x="8" y="325" font-size="18" fill="#242728" font-weight="normal">Use a Fitness Tracker: Wearables like</text><text x="8" y="354" font-size="18" fill="#242728" font-weight="normal">Fitbit or Apple Watch can monitor steps,</text><text x="8" y="383" font-size="18" fill="#242728" font-weight="normal">calories burned, and sleep quality,</text><text x="8" y="412" font-size="18" fill="#242728" font-weight="normal">providing real-time feedback.</text><text x="8" y="457" font-size="18" fill="#666b70" font-weight="normal">… response continues until the</text><text x="8" y="486" font-size="18" fill="#242728" font-weight="normal">generation limit.</text><text x="418.667" y="184" font-size="22" fill="#242728" font-weight="bold">(b) OPSD</text><text x="418.667" y="222" font-size="18" fill="#242728" font-weight="normal">… Track your workouts, measure body</text><text x="418.667" y="251" font-size="18" fill="#242728" font-weight="normal">metrics, take photos, and set SMART</text><text x="418.667" y="280" font-size="18" fill="#242728" font-weight="normal">goals.</text><text x="418.667" y="325" font-size="18" fill="#242728" font-weight="normal">Use Wearable Technology: Devices like</text><text x="418.667" y="354" font-size="18" fill="#242728" font-weight="normal">smartwatches or fitness trackers can</text><text x="418.667" y="383" font-size="18" fill="#242728" font-weight="normal">monitor heart rate, steps, calories burned,</text><text x="418.667" y="412" font-size="18" fill="#242728" font-weight="normal">and sleep quality.</text><text x="418.667" y="457" font-size="18" fill="#666b70" font-weight="normal">… response continues until the</text><text x="418.667" y="486" font-size="18" fill="#242728" font-weight="normal">generation limit.</text><text x="829.333" y="184" font-size="22" fill="#2563b8" font-weight="bold">(c) MemFold</text><text x="829.333" y="222" font-size="18" fill="#2563b8" font-weight="normal">Track your workouts with a fitness app or</text><text x="829.333" y="251" font-size="18" fill="#2563b8" font-weight="normal">journal, and record your strength and</text><text x="829.333" y="280" font-size="18" fill="#2563b8" font-weight="normal">endurance gains.</text><text x="829.333" y="325" font-size="18" fill="#2563b8" font-weight="normal">Take regular body measurements and use</text><text x="829.333" y="354" font-size="18" fill="#2563b8" font-weight="normal">a progress photo log to monitor changes</text><text x="829.333" y="383" font-size="18" fill="#2563b8" font-weight="normal">in body composition.</text><text x="829.333" y="428" font-size="18" fill="#242728" font-weight="normal">Set specific, measurable goals, stay</text><text x="829.333" y="457" font-size="18" fill="#242728" font-weight="normal">consistent, and adjust your plan as</text><text x="829.333" y="486" font-size="18" fill="#242728" font-weight="normal">needed.</text><text x="8" y="535" font-size="14" fill="#666b70" font-weight="bold">Incorrect: violates preference</text><text x="8" y="560" font-size="12" fill="#666b70" font-weight="normal">300 answer tokens</text><text x="418.667" y="535" font-size="14" fill="#666b70" font-weight="bold">Incorrect: violates preference</text><text x="418.667" y="560" font-size="12" fill="#666b70" font-weight="normal">300 answer tokens</text><text x="829.333" y="535" font-size="14" fill="#2563b8" font-weight="bold">Correct: respects preference</text><text x="829.333" y="560" font-size="12" fill="#666b70" font-weight="normal">96 answer tokens</text></svg>
